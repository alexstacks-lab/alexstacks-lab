<svg xmlns="http://www.w3.org/2000/svg" width="393" height="60" viewBox="0 0 393 60" font-family="ui-monospace, SFMono-Regular, 'JetBrains Mono', Menlo, Consolas, monospace"><style>@media (prefers-reduced-motion: reduce){*{animation:none!important;opacity:1!important;transform:none!important}}.pop{transform-box:fill-box;transform-origin:center;opacity:0;animation:pop .55s cubic-bezier(.2,1.4,.4,1) both}@keyframes pop{0%{opacity:0;transform:scale(.8)}100%{opacity:1;transform:none}}.fl{animation:fl 3.40s ease-in-out infinite alternate}@keyframes fl{0%{transform:translateY(3px)}100%{transform:translateY(-3px)}}.sh{transform-box:fill-box;transform-origin:center;animation:sh 3.40s ease-in-out infinite alternate}@keyframes sh{0%{transform:scaleX(1);opacity:.6}100%{transform:scaleX(.75);opacity:.2}}</style><defs><filter id="bl" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="3"/></filter></defs><g class="pop" style="animation-delay:0.10s"><ellipse class="sh" cx="196.8" cy="52" rx="184.8" ry="3" fill="#39d353" filter="url(#bl)"/><g class="fl"><rect x="4" y="6" width="385.6" height="38" rx="10" fill="#161b22" stroke="#39d353" stroke-opacity=".65"/><rect x="5" y="7" width="383.6" height="18.0" rx="9" fill="#39d353" fill-opacity=".08"/><circle cx="27" cy="25.0" r="5" fill="#39d353"/><circle cx="27" cy="25.0" r="5" fill="none" stroke="#39d353" stroke-width="1.5"><animate attributeName="r" values="5;10" dur="1.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0" dur="1.6s" repeatCount="indefinite"/></circle><text x="46" y="30.0" font-size="14" xml:space="preserve"><tspan fill="#e6edf3" font-weight="700">Disponible</tspan><tspan fill="#7d8590">  prácticas pre-profesionales</tspan></text></g></g></svg>